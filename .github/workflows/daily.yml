name: Daily content
on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC (05:17 in Barcelona in winter)
  workflow_dispatch:        # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch good news and On this day
        run: python scripts/fetch_news.py
        env:
          CF_ACCOUNT_ID: 946988b3b2c389cd600ef11788a3370d   # Cloudflare account id (not a secret)
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Keep database awake (free Supabase projects pause after 7 quiet days)
        run: |
          curl -s -o /dev/null -w "supabase %{http_code}\n" "https://bxfrgxxwbzeuhyqaydit.supabase.co/rest/v1/entries?select=id&limit=1" \
            -H "apikey: sb_publishable_YQgSRqfTQg_5TX8f5_AzWQ_0YkZ4uom" -H "Authorization: Bearer sb_publishable_YQgSRqfTQg_5TX8f5_AzWQ_0YkZ4uom" || true
      - name: Save changes
        run: |
          git config user.name "pause-bot"
          git config user.email "pause-bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "Daily good news $(date -u +%F)" && git push)
