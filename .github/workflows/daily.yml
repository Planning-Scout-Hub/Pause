name: Daily content
on:
  schedule:
    # GitHub often starts scheduled runs hours late, so tomorrow's page is prepared from the
    # afternoon on (several tries; the first that works does it, the rest skip).
    # Times are UTC: 13:23, 16:23, 19:23, 21:53 UTC = 14:23, 17:23, 20:23, 22:53 in Spain in winter.
    - cron: "23 13,16,19 * * *"
    - cron: "53 21 * * *"
    - cron: "17 4 * * *"    # morning safety net: only fills today if every evening run failed
  workflow_dispatch:         # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ["scripts/fetch_news.py", ".github/workflows/daily.yml"]
concurrency:
  group: daily-content
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch good news and On this day
        run: python scripts/fetch_news.py
        env:
          CF_ACCOUNT_ID: 946988b3b2c389cd600ef11788a3370d   # Cloudflare account id (not a secret)
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Keep database awake (free Supabase projects pause after 7 quiet days)
        run: |
          curl -s -o /dev/null -w "supabase %{http_code}\n" "https://bxfrgxxwbzeuhyqaydit.supabase.co/rest/v1/entries?select=id&limit=1" \
            -H "apikey: sb_publishable_YQgSRqfTQg_5TX8f5_AzWQ_0YkZ4uom" -H "Authorization: Bearer sb_publishable_YQgSRqfTQg_5TX8f5_AzWQ_0YkZ4uom" || true
      - name: Save changes
        run: |
          git config user.name "pause-bot"
          git config user.email "pause-bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "Daily good news for $(python -c "import json;print(json.load(open('news.json')).get('prepared_for',''))")" && git pull --rebase -q && git push)
